# Nazeer runs inside production: no telemetry, localhost only, no raw error text in the browser.
[browser]
gatherUsageStats = false

[server]
address = "localhost"
# Serves nazeer/static/ (the bundled font) at app/static/. No CDN, no Google Fonts.
enableStaticServing = true

[client]
# "type": the browser shows exception type + generic message only.
# Streamlit still prints full messages to its console, so app.py catches
# errors itself and logs them through nazeer.safe_log.
showErrorDetails = "type"
toolbarMode = "minimal"

# ---------------------------------------------------------------- look
# The palette is defined once: here for Streamlit's own widgets, and as CSS
# variables in nazeer/static/nazeer.css for Nazeer's components (same values).
#   original data = blue, twin = violet, detected = red, needs review = amber.
[theme]
font = "IBM Plex Sans Arabic, Segoe UI, Tahoma, sans-serif"
baseFontSize = 18
baseRadius = "0.6rem"
metricValueFontSize = "2.6rem"

# IBM Plex Sans Arabic, SIL Open Font License 1.1 (nazeer/static/fonts/OFL-IBM-Plex-Sans-Arabic.txt)
[[theme.fontFaces]]
family = "IBM Plex Sans Arabic"
url = "app/static/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2"
weight = 400
unicodeRange = "U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC"

[[theme.fontFaces]]
family = "IBM Plex Sans Arabic"
url = "app/static/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2"
weight = 700
unicodeRange = "U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC"

[[theme.fontFaces]]
family = "IBM Plex Sans Arabic"
url = "app/static/fonts/ibm-plex-sans-arabic-latin-400-normal.woff2"
weight = 400
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "IBM Plex Sans Arabic"
url = "app/static/fonts/ibm-plex-sans-arabic-latin-700-normal.woff2"
