# Alembic config for the Nazeer API.
#   alembic -c nazeer_api/alembic.ini upgrade head      (DATABASE_URL from the environment / .env)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
